[package]
name = "comfy-png-inspector"
version = "0.1.0"
edition = "2021"
description = "ComfyUI / WebUI PNG metadata viewer"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
arboard = "3"
rfd = "0.15"
dirs = "6"
anyhow = "1"
fancy-regex = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
opt-level = "s"
strip = true

[build-dependencies]
winres = "0.1"
