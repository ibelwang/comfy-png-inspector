<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #17141b;
    --bg-2: #1d1a23;
    --surface: #231f2b;
    --surface-2: #2b2635;
    --border: #3a3246;
    --accent: #f2ff59;
    --accent-soft: rgba(242, 255, 89, 0.10);
    --text: #f1eef6;
    --muted: #a79fb5;
    --muted-2: #948ca3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 790px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
  }

  /* ---------- frameless title bar ---------- */
  .titlebar {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    padding: 0 16px 0 18px;
    gap: 10px;
    border-bottom: 1px solid rgba(58, 50, 70, 0.55);
    -webkit-app-region: drag;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 8px;
    overflow: hidden; display: flex;
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  .title { font-size: 14.5px; font-weight: 600; letter-spacing: 0.2px; }
  .ver { font-size: 11px; color: var(--muted-2); margin-left: 2px; }
  .spacer { flex: 1; }
  .winbtn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.4px solid rgba(167, 159, 181, 0.42);
    display: flex; align-items: center; justify-content: center;
  }
  .winbtn svg { display: block; }

  /* ---------- drop zone ---------- */
  .stage {
    flex: 1;
    padding: 20px;
    display: flex;
  }
  .dropzone {
    flex: 1;
    border: 2px dashed rgba(242, 255, 89, 0.45);
    border-radius: 22px;
    background:
      radial-gradient(1000px 460px at 50% 30%, rgba(242, 255, 89, 0.055), transparent 70%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .drop-icon {
    width: 84px; height: 84px; border-radius: 24px;
    border: 1.6px solid rgba(242, 255, 89, 0.55);
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 27px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text);
  }
  .sub {
    margin-top: 10px; font-size: 14px; color: var(--muted);
    letter-spacing: 0.2px;
  }
  .primary {
    margin-top: 26px;
    display: inline-flex; align-items: center; gap: 9px;
    height: 46px; padding: 0 24px; border-radius: 999px;
    background: var(--accent); color: #17141b;
    font-size: 14.5px; font-weight: 700; letter-spacing: 0.2px;
    box-shadow: 0 6px 26px rgba(242, 255, 89, 0.16);
  }
  .keys {
    margin-top: 22px; font-size: 12px; color: var(--muted-2);
    letter-spacing: 0.3px;
  }
  .keys b { color: var(--muted); font-weight: 500; }

  /* ---------- status ---------- */
  .statusbar {
    height: 34px; flex: 0 0 34px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    border-top: 1px solid rgba(58, 50, 70, 0.45);
    color: var(--muted-2); font-size: 11.5px;
  }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="mark">
      <svg viewBox="0 0 256 256">
        <rect width="256" height="256" rx="58" fill="#f2ff59"/>
        <rect x="62" y="72" width="132" height="112" rx="20" fill="none" stroke="#17141b" stroke-width="12"/>
        <circle cx="100" cy="112" r="12" fill="#17141b"/>
        <path d="M72 166 L112 126 L146 160 L166 140 L184 158" fill="none" stroke="#17141b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">ComfyPNG 查看器</div>
    <div class="ver">v0.1</div>
    <div class="spacer"></div>
    <div class="winbtn">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="#a79fb5" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
    <div class="winbtn">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="#a79fb5" stroke-width="1.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="stage">
    <div class="dropzone">
      <div class="drop-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
          <rect x="4.5" y="7" width="29" height="24" rx="4" stroke="#f2ff59" stroke-width="1.6"/>
          <circle cx="13" cy="15" r="2.6" stroke="#f2ff59" stroke-width="1.6"/>
          <path d="M6 27l8.5-8 6.5 6 4.5-4 6.5 6" stroke="#f2ff59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>把图片拖到这里</h1>
      <div class="sub">支持 ComfyUI / WebUI 生成的 PNG、JPEG —— 也可以直接点击这块区域</div>
      <div class="primary">
        <svg width="15" height="15" viewBox="0 0 15 15"><path d="M2 3.5h4l1.2 1.6H13v6.4H2z" stroke="#17141b" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
        选择图片文件
      </div>
      <div class="keys"><b>Ctrl+O</b> 打开 &nbsp;·&nbsp; <b>Ctrl+V</b> 粘贴文件 &nbsp;·&nbsp; <b>Esc</b> 清空</div>
    </div>
  </div>

  <div class="statusbar">
    <span>就绪</span>
    <span>ComfyUI / WebUI 元数据查看器</span>
  </div>
</body>
</html>
